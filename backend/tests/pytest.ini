[pytest]
pythonpath = src
testpaths = tests

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function

# 忽略其他目录中的测试文件
norecursedirs = .git .tox dist build *.egg .venv venv

# 添加自定义选项
addopts = --strict-markers --disable-warnings

# 标记定义
markers =
    integration: 集成测试，需要真实的数据库连接
    unit: 单元测试，使用mock
    slow: 慢速测试